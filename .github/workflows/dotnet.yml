name: PlayerSettings build and release

on:
  pull_request:
    branches: [ "main" ]
  release:
    types:
      - created
  workflow_dispatch:

jobs:
  build:
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      
      - name: Restore dependencies
        run: |
          dotnet restore PlayerSettingsApi/PlayerSettingsApi.csproj
          dotnet restore PlayerSettings/PlayerSettings.csproj
      
      - name: Build PlayerSettingsApi
        run: dotnet build PlayerSettingsApi/PlayerSettingsApi.csproj -c Release --no-restore
      
      - name: Build PlayerSettings
        run: dotnet build PlayerSettings/PlayerSettings.csproj -c Release --no-restore

      - name: Create release asset
        if: github.event_name == 'release'
        run: |
          zip -r PlayerSettings-${{ github.event.release.tag_name }}.zip ./PlayerSettings/bin/Release/addons/ ./PlayerSettingsApi/bin/Release/addons/

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./PlayerSettings-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}